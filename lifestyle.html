<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanti Lifestyle</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo} = React;

const STORAGE_KEY = "shanti_lifestyle_progress";

function Icon({type, size = 16}) {
  const icons = {
    clock: <path d="M12,7 L12,12 L15,14 M21,12 A9,9 0 1,1 3,12 A9,9 0 0,1 21,12 Z" />,
    chevronDown: <path d="M6,9 L12,15 L18,9" />,
    chevronUp: <path d="M18,15 L12,9 L6,15" />,
    check: <path d="M20,6 L9,17 L4,12" />,
    play: <path d="M8,5 L19,12 L8,19 Z" fill="currentColor" stroke="none" />,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {icons[type]}
    </svg>
  );
}

const sections = [
  {
    id: "early-rise",
    meta: "Before sunrise",
    title: "Early Rise",
    description: "Make room for a quieter beginning, without forcing a schedule that does not yet fit.",
    items: [
      {
        id: "wake-up",
        title: "Wake up before 5:00",
        duration: "10 min",
        tag: "FOUNDATION",
        content: {
          description: "Rise before the world becomes loud. An early start is not about discipline for its own sake — it protects a window of quiet that the later hours of the day cannot offer.",
          benefit: "Creates unhurried space for the practices that follow, before daily obligations begin.",
          photo: "4:3 photo — window light, simple bedroom, calm start",
          video: "16:9 video — why an early rise supports practice",
        },
      },
    ],
  },
  {
    id: "bathroom",
    meta: "5 min",
    title: "Bathroom",
    description: "A brief sequence of practical care before sitting down for breath or meditation.",
    items: [
      {
        id: "tongue-scraping",
        title: "Tongue Scraping",
        duration: "1 min",
        content: {
          description: "Draw the scraper lightly from the back of the tongue toward the tip 5–7 times, rinsing it after each pass.",
          benefit: "Supports a fresh feeling in the mouth as the day begins.",
          photo: "4:3 photo — scraper, sink, clean neutral styling",
          video: "16:9 video — gentle technique demonstration",
        },
      },
      {
        id: "teeth",
        title: "Teeth",
        duration: "2 min",
        content: {
          description: "Brush unhurried, covering each surface, before rinsing thoroughly.",
          benefit: "A small act of care that settles the body before sitting practice.",
          photo: "4:3 photo — sink, natural light, tidy styling",
          video: "16:9 video — brief technique note",
        },
      },
      {
        id: "jala-neti",
        title: "Jala Neti — Nasal Rinsing",
        duration: "2 min",
        content: {
          description: "Using a neti pot with warm saline water, tilt the head and let the water pass gently through one nostril and out the other. Repeat on the opposite side.",
          benefit: "Clears the nasal passage, supporting easier, fuller breath during pranayama.",
          photo: "4:3 photo — neti pot, sink, clean neutral styling",
          video: "16:9 video — guided nasal rinsing technique",
        },
      },
    ],
  },
  {
    id: "practice",
    meta: "20 min",
    title: "Practice",
    description: "Ten minutes of breath, followed by ten minutes of stillness.",
    items: [
      {
        id: "pranayama",
        title: "Pranayama",
        duration: "10 min",
        content: {
          description: "Follow the assigned breathing practice at a comfortable pace, allowing the body and attention to become more awake.",
          benefit: "Establishes a measured transition from sleep into study or daily activity.",
          photo: "4:3 photo — seated practice, side angle, soft morning light",
          video: "16:9 video — guided 10-minute practice",
        },
      },
      {
        id: "meditation",
        title: "Meditation",
        duration: "10 min",
        content: {
          description: "Sit in stillness, letting attention settle on the breath or a single point of focus, without straining to control the mind.",
          benefit: "Anchors the mind before the demands of the day begin.",
          photo: "4:3 photo — seated stillness, minimal background",
          video: "16:9 video — guided 10-minute meditation",
        },
      },
    ],
  },
];

const allItemIds = sections.flatMap((s) => s.items.map((i) => i.id));

function loadProgress() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return { checked: [], completed: false };
    const parsed = JSON.parse(raw);
    return { checked: parsed.checked || [], completed: !!parsed.completed };
  } catch (e) {
    return { checked: [], completed: false };
  }
}

function saveProgress(checkedSet, completed) {
  sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ checked: Array.from(checkedSet), completed }));
}

function ChecklistItem({ item, checked, expanded, onToggleCheck, onToggleExpand }) {
  return (
    <div className="bg-[#F8F1E1] rounded-xl overflow-hidden">
      <div className="flex items-center gap-3 px-4 py-3 cursor-pointer flex-wrap" onClick={() => onToggleExpand(item.id)}>
        <button
          onClick={(e) => { e.stopPropagation(); onToggleCheck(item.id); }}
          aria-label={checked ? "Mark as not done" : "Mark as done"}
          className={`w-6 h-6 shrink-0 rounded border-2 flex items-center justify-center transition-colors ${checked ? "bg-[#16342C] border-[#16342C] text-white" : "border-gray-400 text-transparent"}`}
        >
          <Icon type="check" size={14} />
        </button>
        <div className="flex-1 min-w-[8rem]">
          <div className="font-bold text-[#16342C] leading-tight">{item.title}</div>
          <div className="text-sm text-gray-500">{item.duration}</div>
        </div>
        {item.tag && (
          <span className="text-xs font-bold tracking-wide bg-[#F0D94E] text-[#16342C] px-3 py-1 rounded-full whitespace-nowrap">{item.tag}</span>
        )}
        <button className="text-[#16342C] shrink-0" aria-label={expanded ? "Collapse" : "Expand"}>
          <Icon type={expanded ? "chevronUp" : "chevronDown"} />
        </button>
      </div>
      {expanded && (
        <div className="px-4 pb-4 border-t border-black/5 pt-4 space-y-4">
          <p className="text-[#33453D] leading-relaxed">{item.content.description}</p>
          <div className="bg-[#EFE6CE] rounded-lg px-4 py-3 text-[#33453D]">
            <span className="font-bold">Benefit:</span> {item.content.benefit}
          </div>
          <div className="border-2 border-dashed border-[#C9BC9C] rounded-lg h-40 flex items-center justify-center text-center text-sm text-[#8A7F63] px-4">
            {item.content.photo}
          </div>
          <div className="border-2 border-dashed border-[#C9BC9C] rounded-lg h-40 flex flex-col items-center justify-center gap-3 text-center text-sm text-[#8A7F63] px-4">
            <span className="w-12 h-12 rounded-full bg-[#16342C] text-white flex items-center justify-center">
              <Icon type="play" size={20} />
            </span>
            {item.content.video}
          </div>
        </div>
      )}
    </div>
  );
}

function Column({ section, checkedIds, expandedIds, onToggleCheck, onToggleExpand }) {
  return (
    <div className="bg-[#EFE4C9] rounded-2xl p-5 flex flex-col gap-3">
      <div className="text-sm text-gray-500">{section.meta}</div>
      <h2 className="text-2xl font-bold text-[#16342C]">{section.title}</h2>
      <p className="text-[#5B6F63] text-sm leading-relaxed">{section.description}</p>
      <div className="flex flex-col gap-3 mt-1">
        {section.items.map((item) => (
          <ChecklistItem
            key={item.id}
            item={item}
            checked={checkedIds.has(item.id)}
            expanded={expandedIds.has(item.id)}
            onToggleCheck={onToggleCheck}
            onToggleExpand={onToggleExpand}
          />
        ))}
      </div>
    </div>
  );
}

function App() {
  const initial = useMemo(loadProgress, []);
  const [checkedIds, setCheckedIds] = useState(new Set(initial.checked.filter((id) => allItemIds.includes(id))));
  const [expandedIds, setExpandedIds] = useState(new Set());
  const [completed, setCompleted] = useState(initial.completed);

  const allDone = allItemIds.every((id) => checkedIds.has(id));

  function toggleCheck(id) {
    setCheckedIds((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      const stillAllDone = allItemIds.every((i) => next.has(i));
      const nextCompleted = stillAllDone ? completed : false;
      if (!stillAllDone) setCompleted(false);
      saveProgress(next, stillAllDone ? completed : false);
      return next;
    });
  }

  function toggleExpand(id) {
    setExpandedIds((prev) => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  }

  function markCompleted() {
    if (!allDone) return;
    setCompleted(true);
    saveProgress(checkedIds, true);
  }

  return (
    <div className="min-h-screen bg-[#E7DCC1] flex justify-center py-10 px-4">
      <div className="w-full max-w-6xl">
        <div className="flex items-center gap-3 mb-6">
          <span className="flex items-center gap-1.5 text-sm font-bold text-[#16342C] bg-[#F8F1E1] rounded-full px-4 py-1.5">
            <Icon type="clock" size={14} /> 15 MIN
          </span>
          <span className="text-sm font-bold text-[#16342C] bg-[#F8F1E1] rounded-full px-4 py-1.5 tracking-wide">LIFESTYLE</span>
        </div>

        <h1 className="text-6xl font-black text-[#16342C] mb-4">Shanti Lifestyle</h1>
        <p className="text-lg text-[#5B6F63] max-w-2xl mb-8 leading-relaxed">
          A calm morning structure drawn from traditional yogic practice. Begin with what fits your present rhythm, then let consistency do the quiet work.
        </p>

        <div className="bg-[#F2E9D6] rounded-3xl p-4 md:p-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {sections.map((section) => (
              <Column
                key={section.id}
                section={section}
                checkedIds={checkedIds}
                expandedIds={expandedIds}
                onToggleCheck={toggleCheck}
                onToggleExpand={toggleExpand}
              />
            ))}
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mt-6 pt-2">
            <p className="text-sm text-[#8A7F63]">
              {completed ? "Completed — saved for the current browser session." : "Completion is stored for the current browser session."}
            </p>
            <div className="flex gap-3">
              <a href="index.html" className="px-6 py-2.5 rounded-lg bg-[#16342C] text-white font-bold hover:bg-[#1F4A3F] transition-colors">
                Back to Dashboard
              </a>
              <button
                onClick={markCompleted}
                disabled={!allDone}
                className={`px-6 py-2.5 rounded-lg font-bold transition-colors ${
                  allDone
                    ? "bg-[#F0D94E] text-[#16342C] hover:bg-[#E6CC2E] cursor-pointer"
                    : "bg-[#F1EAB9] text-[#B8AF7E] cursor-not-allowed"
                }`}
              >
                {completed ? "Completed ✓" : "Mark as completed"}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body></html>

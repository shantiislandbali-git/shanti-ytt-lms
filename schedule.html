<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — Shanti Island</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

function Icon({ type, size = 20 }) {
  const icons = {
    chevronRight: <path d="M9,6 L15,12 L9,18" />,
    arrowLeft: <path d="M19,12 H5 M11,6 L5,12 L11,18" />,
    arrowRight: <path d="M5,12 H19 M13,6 L19,12 L13,18" />,
    check: <path d="M6,12.5 L10,16.5 L18,7.5" />,
    lock: <><rect x="6" y="11" width="12" height="9" rx="2" /><path d="M8.5,11 V8 a3.5,3.5 0 0,1 7,0 v3" /></>,
    bell: <><path d="M6,17 c0,-1.5 1,-2.5 1,-5.5 a5,5 0 0,1 10,0 c0,3 1,4 1,5.5 Z" /><path d="M10,20 a2,2 0 0,0 4,0" /></>,
    person: <><circle cx="12" cy="9" r="3.2" /><path d="M5,19 c0,-4 3.2,-6 7,-6 s7,2 7,6" /></>,
    people: <><circle cx="9" cy="8.5" r="2.8" /><path d="M3.5,19 c0,-3.6 2.8,-5.2 5.5,-5.2 s5.5,1.6 5.5,5.2" /><circle cx="16.5" cy="9.5" r="2.2" /><path d="M13.5,19 c0.2,-3 2.2,-4.3 4.6,-4.3 c1,0 1.9,0.2 2.6,0.6" /></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      {icons[type]}
    </svg>
  );
}

function Logo() {
  return (
    <svg width="34" height="34" viewBox="0 0 24 24">
      <circle cx="12" cy="7" r="4" fill="white" opacity="0.95" />
      <circle cx="12" cy="17" r="4" fill="white" opacity="0.95" />
      <circle cx="7" cy="12" r="4" fill="white" opacity="0.95" />
      <circle cx="17" cy="12" r="4" fill="white" opacity="0.95" />
      <circle cx="12" cy="12" r="3" fill="#C4F274" />
    </svg>
  );
}

function Navbar() {
  return (
    <header className="bg-[#0F3D35] text-white px-6 md:px-10 py-3 flex items-center justify-between">
      <a href="index.html" className="flex items-center gap-3">
        <Logo />
        <span className="font-bold leading-tight text-lg">Shanti<br />Island</span>
      </a>
      <nav className="hidden sm:flex items-center gap-8 font-semibold">
        <a href="index.html" className="hover:text-[#C4F274] transition-colors">Dashboard</a>
        <a href="schedule.html" className="text-[#C4F274]">Schedule</a>
      </nav>
      <div className="flex items-center gap-5">
        <span className="hidden sm:inline font-semibold">nishchuk</span>
        <span className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
          <Icon type="person" size={18} />
        </span>
        <span className="relative">
          <Icon type="bell" size={20} />
          <span className="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-red-500 border border-[#0F3D35]" />
        </span>
        <Icon type="people" size={22} />
      </div>
    </header>
  );
}

const STATUS = { completed: "completed", current: "current", locked: "locked" };

const modules = [
  {
    id: 1,
    month: "Month 1",
    badge: "ON THE PATH",
    title: "Module 1: Teacher's Awakening",
    description: "Your foundations are set — conscious breath, grounded movement, and a clear sense of why you're here",
    days: [
      { title: "Welcome & Orientation", status: STATUS.completed, blurb: "A first look at the path ahead and the people walking it with you." },
      { title: "Breath, Body & Why We Practice", status: STATUS.completed, blurb: "The reasoning behind the practice, before the practice itself begins." },
      { title: "Breath, Body & The Teaching Foundation", status: STATUS.current, blurb: "Where you are right now — building the base that teaching stands on." },
      { title: "Alignment & The Ashtanga Foundation", status: STATUS.locked },
      { title: "Moving with Awareness & Intention", status: STATUS.locked },
      { title: "Integration & Inner Stability", status: STATUS.locked },
    ],
  },
  {
    id: 2,
    month: "Month 1",
    badge: "AWAITING",
    title: "Module 2: Deepening the Foundations",
    description: "Your practice is deepening — breath with retention, hips open wide, and your first real students taught",
    days: [
      { title: "Foundations of Breath & Awareness", status: STATUS.locked },
      { title: "Standing Strong, Breathing Deep", status: STATUS.locked },
      { title: "Opening the Hips & The Heart", status: STATUS.locked },
      { title: "Core, Balance & Inversion Basics", status: STATUS.locked },
      { title: "Sequencing, Assisting & Adjustments", status: STATUS.locked },
      { title: "Teaching Your First Class", status: STATUS.locked },
    ],
  },
  {
    id: 3,
    month: "Month 2",
    badge: "AWAITING",
    title: "Module 3: Confidence in Practice and Voice",
    description: "Your presence is found — a voice that carries, a confident backbend, and Half Primary in your hands",
    days: [
      { title: "Finding Your Voice as a Teacher", status: STATUS.locked },
      { title: "Backbends with Strength & Grace", status: STATUS.locked },
      { title: "Twists, Detox & Subtle Body Awareness", status: STATUS.locked },
      { title: "Half Primary Series – Part 1", status: STATUS.locked },
      { title: "Half Primary Series – Part 2", status: STATUS.locked },
      { title: "Confidence in Teaching & Being", status: STATUS.locked },
    ],
  },
  ...Array.from({ length: 6 }, (_, i) => ({
    id: i + 4,
    month: "Month TBD",
    badge: "AWAITING",
    title: `Module ${i + 4}: Coming Soon`,
    description: "Content for this module is being finalized and will appear here once ready.",
    days: Array.from({ length: 6 }, (_, d) => ({ title: `Day 0${d + 1} — To be announced`, status: STATUS.locked })),
  })),
];

const PAGE_SIZE = 3;
const TOTAL_PAGES = Math.ceil(modules.length / PAGE_SIZE);

function StatusIcon({ status }) {
  if (status === STATUS.completed) {
    return (
      <span className="w-7 h-7 shrink-0 rounded-full border-2 border-green-500 bg-white text-green-500 flex items-center justify-center">
        <Icon type="check" size={14} />
      </span>
    );
  }
  if (status === STATUS.current) {
    return <span className="w-7 h-7 shrink-0 rounded-full bg-[#F0D94E]" />;
  }
  return (
    <span className="w-7 h-7 shrink-0 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center">
      <Icon type="lock" size={13} />
    </span>
  );
}

function DayRow({ day, isExpanded, onToggle }) {
  const locked = day.status === STATUS.locked;
  const current = day.status === STATUS.current;

  return (
    <div>
      <button
        onClick={locked ? undefined : onToggle}
        disabled={locked}
        title={locked ? "Complete earlier days to unlock" : undefined}
        className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition-colors ${
          current ? "bg-[#FBF3D3] border-2 border-[#F0D94E]" : "bg-[#F8F1E1] border-2 border-transparent"
        } ${locked ? "cursor-not-allowed" : "cursor-pointer hover:brightness-95"}`}
      >
        <StatusIcon status={day.status} />
        <span className={`flex-1 text-sm font-semibold ${locked ? "text-gray-400" : "text-[#16342C]"}`}>
          {day.title}
        </span>
        <span className={locked ? "text-gray-300" : "text-[#16342C]"}>
          <Icon type="chevronRight" size={18} />
        </span>
      </button>
      {isExpanded && !locked && (
        <p className="text-sm text-[#5B6F63] leading-relaxed px-3 pt-2 pb-1">{day.blurb || "Details for this day will open once it's underway."}</p>
      )}
    </div>
  );
}

function ModuleCard({ module }) {
  const [expandedDay, setExpandedDay] = useState(null);

  return (
    <div className="bg-[#EFE4C9] rounded-2xl p-5 flex flex-col gap-3">
      <div className="flex items-center justify-between">
        <span className="text-sm text-gray-500">{module.month}</span>
        <span
          className={`text-xs font-bold tracking-wide px-3 py-1 rounded-full whitespace-nowrap ${
            module.badge === "ON THE PATH" ? "bg-[#F0D94E] text-[#16342C]" : "bg-white/70 text-gray-500 border border-gray-300"
          }`}
        >
          {module.badge}
        </span>
      </div>
      <h3 className="text-xl font-bold text-[#16342C] leading-snug">{module.title}</h3>
      <p className="text-[#5B6F63] text-sm leading-relaxed">{module.description}</p>
      <div className="flex flex-col gap-2 mt-1">
        {module.days.map((day, i) => (
          <DayRow
            key={i}
            day={day}
            isExpanded={expandedDay === i}
            onToggle={() => setExpandedDay(expandedDay === i ? null : i)}
          />
        ))}
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState(0);
  const visible = modules.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

  return (
    <div className="min-h-screen bg-[#E7DCC1]">
      <Navbar />
      <div className="max-w-7xl mx-auto px-4 md:px-8 py-10">
        <h1 className="text-4xl md:text-5xl font-black text-[#16342C] mb-3">Your Journey with Shanti Island</h1>
        <p className="text-lg font-bold text-[#1F4A3F] mb-8">
          A guided learning path through movement, philosophy, embodiment, and live practice at Shanti Island
        </p>

        <div className="bg-[#F2E9D6] rounded-3xl p-4 md:p-6">
          <h2 className="text-2xl font-bold text-[#16342C] mb-1">Schedule</h2>
          <p className="text-[#5B6F63] text-sm mb-5">6 training days per module • Homework • Live Sessions</p>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            {visible.map((module) => (
              <ModuleCard key={module.id} module={module} />
            ))}
          </div>

          <div className="flex items-center justify-between mt-6 pt-2">
            <div className="flex gap-3 text-[#16342C]">
              <button
                onClick={() => setPage((p) => Math.max(0, p - 1))}
                disabled={page === 0}
                aria-label="Previous modules"
                className="disabled:opacity-30 disabled:cursor-not-allowed hover:opacity-70 transition-opacity"
              >
                <Icon type="arrowLeft" size={22} />
              </button>
              <button
                onClick={() => setPage((p) => Math.min(TOTAL_PAGES - 1, p + 1))}
                disabled={page === TOTAL_PAGES - 1}
                aria-label="Next modules"
                className="disabled:opacity-30 disabled:cursor-not-allowed hover:opacity-70 transition-opacity"
              >
                <Icon type="arrowRight" size={22} />
              </button>
            </div>
            <div className="flex items-center gap-2">
              {Array.from({ length: TOTAL_PAGES }, (_, i) => (
                <button
                  key={i}
                  onClick={() => setPage(i)}
                  aria-label={`Go to page ${i + 1}`}
                  className={`h-2.5 rounded-full transition-all ${i === page ? "w-6 bg-[#16342C]" : "w-2.5 bg-[#C9BC9C]"}`}
                />
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body></html>
